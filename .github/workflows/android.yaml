name: android
on:
  workflow_dispatch:
    inputs:
      api:
        description: Android API level
        default: "34"
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OUT: ${{ github.workspace }}/out
      ROOT: ${{ github.workspace }}
      BIN: ${{ github.workspace }}/.bin
      SYM: ${{ github.workspace }}/app/build/sym
      APK_REL: ${{ github.workspace }}/app/build/app/outputs/flutter-apk/app-release.apk
      APK_PROF: ${{ github.workspace }}/app/build/app/outputs/flutter-apk/app-profile.apk
    steps:
      - uses: actions/checkout@v4
      - name: facts
        run: |
          mkdir -p $OUT/raw; T0=$(date +%s); echo "T0=$T0" >> $GITHUB_ENV
          { nproc; free -g | head -2; ls -l /dev/kvm; df -h / | tail -1; } | tee $OUT/raw/runner-facts.txt
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.4", channel: stable, cache: true }
      - name: stores + backend
        run: bash stack/start.sh > $OUT/raw/stack-start.txt 2>&1 < /dev/null; cat $OUT/raw/stack-start.txt
      - name: build release (obfuscated) + profile
        working-directory: app
        run: |
          s=$(date +%s)
          flutter pub get; mkdir -p build/sym
          flutter build apk --release --obfuscate --split-debug-info=build/sym --extra-gen-snapshot-options=--save-obfuscation-map=build/sym/obfuscation-map.json --target-platform android-x64 --build-name 1.2.0 --build-number 12 2>&1 | tail -5
          r=$(date +%s)
          flutter build apk --profile --target-platform android-x64 --build-name 1.2.0 --build-number 12 2>&1 | tail -3
          e=$(date +%s)
          echo "release_build_s=$((r-s)) profile_build_s=$((e-r))" | tee $OUT/raw/build-times.txt
          ls -la build/app/outputs/flutter-apk/ build/sym | tee -a $OUT/raw/build-times.txt
          flutter --version --machine > $OUT/raw/flutter-version.json
          echo "ENGINE=$(jq -r .engineRevision $OUT/raw/flutter-version.json)" >> $GITHUB_ENV
      - name: emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/android.sh
      - name: post (symbols, profiles, perfetto, dumps)
        if: always()
        run: bash ci/android-post.sh; echo "job_seconds_to_here=$(( $(date +%s) - T0 ))" | tee $OUT/raw/job-time.txt
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-out
          path: |
            out/raw
            out/post
            out/arrived
            out/logs
            out/*.ndjson
            app/build/sym
